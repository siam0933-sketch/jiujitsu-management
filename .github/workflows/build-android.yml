name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      app_type:
        description: 'App Type to build (kiosk or member)'
        required: true
        default: 'kiosk'
        type: choice
        options:
          - kiosk
          - member

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Configure Capacitor
        run: |
          if [ "${{ github.event.inputs.app_type }}" = "member" ]; then
            cat <<EOF > capacitor.config.ts
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.myjiujitsu.member',
            appName: 'My jiu-jitsu Member',
            webDir: 'public',
            server: {
              url: 'https://jiujitsu-management.vercel.app/member-app',
              cleartext: true
            }
          };
          export default config;
          EOF
          
          # Replace Android strings to match Member app
          sed -i 's/My jiu-jitsu Kiosk/My jiu-jitsu Member/g' android/app/src/main/res/values/strings.xml
          sed -i 's/com.myjiujitsu.kiosk/com.myjiujitsu.member/g' android/app/src/main/res/values/strings.xml
          else
            cat <<EOF > capacitor.config.ts
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.myjiujitsu.kiosk',
            appName: 'My jiu-jitsu Kiosk',
            webDir: 'public',
            server: {
              url: 'https://jiujitsu-management.vercel.app/kiosk/login',
              cleartext: true
            }
          };
          export default config;
          EOF

          # Ensure Android strings match Kiosk app
          git checkout android/app/src/main/res/values/strings.xml || true
          fi
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build APK
        working-directory: ./android
        run: |
            chmod +x gradlew
            ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_type }}-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
